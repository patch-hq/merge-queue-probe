name: test
on:
  pull_request:
  merge_group:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "${{ github.event_name }}" = merge_group ] && [ -f fail-in-queue ]; then echo "failing in the queue on purpose"; exit 1; fi
          echo ok
